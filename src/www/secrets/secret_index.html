<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área secreta — webserv</title>
<style>
  :root{
    --bg: #08060c;
    --bg-glow: #1a0f2e;
    --purple: #9b5de5;
    --purple-dim: #4a2a73;
    --text: #ece9f2;
    --muted: #6f6a80;
    --line: #1c1822;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:
      radial-gradient(circle at 50% 30%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    padding: 2rem;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(155,93,229,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,93,229,0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(circle at 50% 35%, black 0%, transparent 70%);
    pointer-events:none;
  }

  .panel{
    position:relative;
    display:flex;
    align-items:center;
    gap: 2.2rem;
    max-width: 640px;
  }

  .bar{
    width:2px;
    height:9rem;
    background: linear-gradient(180deg, transparent, var(--purple), transparent);
    box-shadow: 0 0 18px 1px var(--purple);
    flex-shrink:0;
    animation: pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { opacity:.55; }
    50% { opacity:1; }
  }

  .content{
    display:flex;
    flex-direction:column;
    gap:.7rem;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color: var(--purple);
  }

  h1{
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: clamp(1.9rem, 5vw, 2.8rem);
    font-weight:700;
    line-height:1.1;
    letter-spacing:-.02em;
  }
  h1 em{
    font-style:normal;
    background: linear-gradient(135deg, #fff 0%, var(--purple) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .message{
    font-size:.9rem;
    color: var(--muted);
    line-height:1.6;
    max-width: 46ch;
  }

  .readout{
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size:.78rem;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--line);
    border-left: 2px solid var(--purple);
    padding: .9rem 1.1rem;
    border-radius:4px;
    color: var(--muted);
    word-break: break-all;
    margin-top:.3rem;
  }
  .readout b{ color: var(--text); font-weight:500; }
  .readout .ok{ color: var(--purple); }

  .actions{ margin-top:.5rem; }

  .btn{
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size:.8rem;
    font-weight:700;
    letter-spacing:.02em;
    padding: .68rem 1.3rem;
    border-radius:6px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    background: var(--purple);
    color: #0c0714;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover{ transform: translateY(-1px); filter:brightness(1.1); }

  .footer{
    margin-top:.4rem;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size:.68rem;
    color: var(--purple-dim);
    letter-spacing:.08em;
  }

  @media (max-width: 560px){
    .panel{ flex-direction:column; align-items:flex-start; gap:1.4rem; }
    .bar{ width:9rem; height:2px; }
  }

  @media (prefers-reduced-motion: reduce){
    .bar{ animation:none; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="bar" aria-hidden="true"></div>
    <div class="content">
      <span class="eyebrow">Área restrita</span>
      <h1>Bem-vind<em>o</em> à zona secreta</h1>
      <p class="message">Este é um arquivo estático do projeto webserv, servido apenas para quem possui uma sessão válida.</p>

      <div class="readout">
        COOKIE RECEBIDO: <b class="ok" id="cookie">carregando...</b><br>
        ROTA SOLICITADA: <b id="path">/carregando...</b>
      </div>

      <div class="actions">
        <a href="/" class="btn">← Voltar ao início</a>
      </div>
      <span class="footer">webserv // secret</span>
    </div>
  </div>

<script>
  document.getElementById('path').textContent = window.location.pathname || '/desconhecido';

  function getSessionCookie(){
    const match = document.cookie.match(/(?:^|;\s*)session_id=([^;]*)/);
    return match ? decodeURIComponent(match[1]) : null;
  }

  const sid = getSessionCookie();
  document.getElementById('cookie').textContent = sid
    ? ('session_id=' + sid)
    : '(nenhum cookie encontrado)';
</script>

</body>
</html>
