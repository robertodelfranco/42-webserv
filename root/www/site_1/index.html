<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site 3</title>
<style>
  :root{
    --bg: #0a0605;
    --bg-glow: #2a0f0f;
    --red: #f85149;
    --red-dim: #7a2323;
    --green: #3fb950;
    --text: #f0ece9;
    --muted: #7a6f6a;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background:
      radial-gradient(circle at 50% 42%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(63,185,80,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,185,80,0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 70%);
    pointer-events:none;
  }

  .panel{
    position:relative;
    text-align:left;
    display:flex;
    align-items:center;
    gap: 2.2rem;
    padding: 0 2rem;
  }

  .bar{
    width:2px;
    height:6.4rem;
    background: linear-gradient(180deg, transparent, var(--green), transparent);
    box-shadow: 0 0 18px 1px var(--green);
    flex-shrink:0;
    animation: pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { opacity:.55; }
    50% { opacity:1; }
  }

  .content{
    display:flex;
    flex-direction:column;
    gap:.55rem;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color: var(--green);
  }

  .code{
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
    background: linear-gradient(135deg, #fff 0%, var(--red) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .title{
    font-size:1.05rem;
    font-weight:600;
    color: var(--text);
  }

  .message{
    font-size:.9rem;
    color: var(--muted);
    max-width:34ch;
    line-height:1.5;
  }

  .footer{
    margin-top:.4rem;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size:.68rem;
    color: var(--red-dim);
    letter-spacing:.08em;
  }

  @media (max-width: 480px){
    .panel{ gap:1.4rem; }
    .bar{ height:5rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .bar{ animation:none; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="bar" aria-hidden="true"></div>
    <div class="content">
      <span class="eyebrow">Virtual Host</span>
      <span class="code">SITE 3</span>
      <span class="title">server_name: site1.local</span>
      <p class="message">Carregado com sucesso, se você está vendo esta página, o virtual host "site1" respondeu.</p>
      <span class="footer">webserv // site3</span>
    </div>
  </div>
</body>
</html>
