<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload — webserv</title>
<style>
  :root{
    --bg: #08060c;
    --bg-glow: #1a0f2e;
    --purple: #9b5de5;
    --purple-dim: #4a2a73;
    --text: #ece9f2;
    --muted: #6f6a80;
    --line: #1c1822;
    --ok: #3fb950;
    --err: #f85149;
    --err-dim: #7a2323;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:
      radial-gradient(circle at 50% 20%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(155,93,229,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,93,229,0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(circle at 50% 15%, black 0%, transparent 70%);
    pointer-events:none;
  }

  header{
    position:relative;
    display:flex;
    align-items:center;
    gap:.7rem;
    padding: 1.2rem 2rem;
    border-bottom: 1px solid rgba(155,93,229,0.15);
  }

  .logo{ font-size:1rem; font-weight:700; color: var(--text); }
  .logo span{ color: var(--purple); }

  .badge{
    font-size:.68rem;
    letter-spacing:.05em;
    color: var(--purple);
    background: rgba(155,93,229,0.1);
    border: 1px solid var(--purple-dim);
    padding: .18rem .55rem;
    border-radius: 999px;
  }

  header a{
    margin-left:auto;
    color: var(--muted);
    font-size:.8rem;
    text-decoration:none;
  }
  header a:hover{ color: var(--purple); }

  main{
    position:relative;
    flex:1;
    max-width: 560px;
    width:100%;
    margin: 0 auto;
    padding: 3rem 2rem;
  }

  h1{
    font-size: 1.5rem;
    font-weight:700;
    margin-bottom:.4rem;
    letter-spacing:-.01em;
  }
  h1 em{
    font-style:normal;
    background: linear-gradient(135deg, #fff 0%, var(--purple) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .subtitle{
    color: var(--muted);
    font-size:.85rem;
    margin-bottom: 2.2rem;
  }

  .drop-zone{
    border: 1.5px dashed var(--purple-dim);
    border-radius: 8px;
    padding: 3rem 2rem;
    text-align:center;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease;
    margin-bottom: 1.4rem;
  }
  .drop-zone:hover, .drop-zone.drag-over{
    border-color: var(--purple);
    background: rgba(155,93,229,0.05);
  }
  .drop-zone input{ display:none; }

  .drop-text{
    color: var(--muted);
    font-size:.85rem;
    line-height:1.7;
  }
  .drop-text strong{ color: var(--purple); font-weight:600; }

  #file-list{
    margin-top: 1rem;
    font-size:.78rem;
    color: var(--text);
    text-align:left;
    display:inline-block;
  }
  #file-list div{
    padding: .15rem 0;
    color: var(--muted);
  }
  #file-list div::before{
    content: "· ";
    color: var(--purple);
  }

  .btn{
    width:100%;
    padding: .78rem;
    background: var(--purple);
    color: #0c0714;
    border:none;
    border-radius:6px;
    font-family: inherit;
    font-size:.88rem;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    transition: filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.1); }
  .btn:disabled{
    background: var(--line);
    color: var(--muted);
    cursor:not-allowed;
  }

  #status{
    margin-top: 1.2rem;
    padding: .7rem 1rem;
    border-radius:6px;
    font-size:.8rem;
    display:none;
  }
  #status.ok{
    background: rgba(63,185,80,0.1);
    border: 1px solid rgba(63,185,80,0.3);
    color: var(--ok);
    display:block;
  }
  #status.err{
    background: rgba(248,81,73,0.1);
    border: 1px solid rgba(248,81,73,0.3);
    color: var(--err);
    display:block;
  }

  footer{
    position:relative;
    border-top: 1px solid rgba(155,93,229,0.15);
    padding: 1rem 2rem;
    font-size:.72rem;
    color: var(--muted);
  }

  .list-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-top: 2.6rem;
    margin-bottom: .4rem;
  }
  .list-header h2{
    font-size:.9rem;
    font-weight:700;
    color: var(--text);
  }
  .refresh{
    background:none;
    border:none;
    color: var(--muted);
    font-family: inherit;
    font-size:.75rem;
    cursor:pointer;
    text-decoration:none;
  }
  .refresh:hover{ text-decoration:underline; }

  .uploaded-list{
    border-top: 1px solid var(--line);
  }
  .file-row{
    display:flex;
    align-items:center;
    gap: .9rem;
    padding: .7rem 0;
    border-bottom: 1px solid var(--line);
    font-size:.85rem;
  }
  .file-row .name{
    color: var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .file-row .del-btn{
    margin-left:auto;
    background:none;
    border: 1px solid var(--err-dim);
    color: var(--err);
    font-family: inherit;
    font-size:.72rem;
    padding: .3rem .6rem;
    border-radius:5px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
    flex-shrink:0;
  }
  .file-row .del-btn:hover{ background: var(--err); color: #fff; }
  .file-row .del-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .empty, .loading{
    color: var(--muted);
    font-size:.82rem;
    padding: 1rem 0;
  }
</style>
</head>
<body>

<header>
    <div class="logo">web<span>serv</span></div>
    <span class="badge">POST</span>
    <span class="badge">DELETE</span>
    <span class="badge">raw body</span>
    <a href="/">← voltar</a>
</header>

<main>
    <h1>Upload de <em>arquivos</em></h1>
    <p class="subtitle">Selecione ou arraste um ou mais arquivos para enviar ao servidor.</p>

    <form id="upload-form">
        <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" name="file" multiple>
            <div class="drop-text">
                Arraste arquivos aqui ou <strong>clique para selecionar</strong>
            </div>
            <div id="file-list"></div>
        </div>

        <button type="submit" class="btn" id="submit-btn" disabled>Enviar arquivo(s)</button>
    </form>

    <div id="status"></div>

    <div class="list-header">
        <h2>arquivos em /upload/</h2>
        <button class="refresh" id="refresh-btn">↻ atualizar</button>
    </div>
    <div class="uploaded-list" id="uploaded-list">
        <div class="loading">carregando lista...</div>
    </div>
</main>

<footer>
    POST /upload/&lt;filename&gt; — os arquivos são salvos em /upload/
</footer>

<script>
    const dropZone     = document.getElementById('drop-zone');
    const fileInput    = document.getElementById('file-input');
    const fileListEl   = document.getElementById('file-list');
    const submitBtn    = document.getElementById('submit-btn');
    const statusEl     = document.getElementById('status');
    const form         = document.getElementById('upload-form');
    const uploadedEl   = document.getElementById('uploaded-list');
    const refreshBtn   = document.getElementById('refresh-btn');

    function setFiles(fileArray) {
        fileListEl.innerHTML = '';
        if (fileArray && fileArray.length) {
            fileArray.forEach(function(file) {
                var row = document.createElement('div');
                row.textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
                fileListEl.appendChild(row);
            });
        }
        submitBtn.disabled = !(fileArray && fileArray.length);
    }

    dropZone.addEventListener('click', function() {
        fileInput.click();
    });

    fileInput.addEventListener('change', function() {
        setFiles(Array.from(fileInput.files));
    });

    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        var files = e.dataTransfer.files;
        if (files && files.length) {
            var dt = new DataTransfer();
            for (var i = 0; i < files.length; i++) {
                dt.items.add(files[i]);
            }
            fileInput.files = dt.files;
            setFiles(Array.from(fileInput.files));
        }
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        var files = Array.from(fileInput.files);
        if (!files.length) return;

        statusEl.className = '';
        statusEl.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';

        var sendNext = function(index) {
            if (index >= files.length) {
                submitBtn.textContent = 'Enviar arquivo(s)';
                statusEl.className = 'ok';
                statusEl.textContent = files.length + ' arquivo(s) enviado(s) com sucesso!';
                fileInput.value = '';
                setFiles([]);
                loadUploaded();
                return;
            }

            var file = files[index];

            /* o servidor não faz parsing de multipart/form-data: ele espera
            o nome do arquivo na própria URL e os bytes crus no body */
            fetch('/upload/' + encodeURIComponent(file.name), { method: 'POST', body: file })
                .then(function(res) {
                    if (res.ok) {
                        sendNext(index + 1);
                    } else {
                        return res.text().then(function(t) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Enviar arquivo(s)';
                            statusEl.className = 'err';
                            statusEl.textContent = 'Erro ' + res.status + ' ao enviar "' + files[index].name + '": ' + t;
                        });
                    }
                })
                .catch(function(err) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar arquivo(s)';
                    statusEl.className = 'err';
                    statusEl.textContent = 'Falha na conexão ao enviar "' + files[index].name + '": ' + err.message;
                });
        };

        sendNext(0);
    });

    function renderUploaded(names) {
        uploadedEl.innerHTML = '';
        if (!names.length) {
            uploadedEl.innerHTML = '<div class="empty">nenhum arquivo em /upload/</div>';
            return;
        }

        names.forEach(function(name) {
            var row     = document.createElement('div');
            row.className = 'file-row';

            var nameEl  = document.createElement('span');
            nameEl.className = 'name';
            nameEl.textContent = name;

            var delEl   = document.createElement('button');
            delEl.className = 'del-btn';
            delEl.type = 'button';
            delEl.textContent = 'deletar';
            delEl.addEventListener('click', function() {
                deleteUploaded(name, row);
            });

            row.appendChild(nameEl);
            row.appendChild(delEl);
            uploadedEl.appendChild(row);
        });
    }

    // Busca a listagem em GET /upload/ (autoindex do diretório) e extrai
    // os nomes de arquivo a partir dos links <a href="..."> retornados.
    function loadUploaded() {
        uploadedEl.innerHTML = '<div class="loading">carregando lista...</div>';

        fetch('/upload/', { method: 'GET' })
            .then(function(res) {
                if (!res.ok) throw new Error('status ' + res.status);
                return res.text();
            })
            .then(function(html) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var links = Array.from(doc.querySelectorAll('a'));

                var names = links
                    .map(function(a) { return a.getAttribute('href'); })
                    .filter(function(href) {
                        return href && href !== '../' && href !== '/' && href.indexOf('..') !== 0;
                    })
                    .map(function(href) { return decodeURIComponent(href.replace(/\/$/, '')); })
                    // upload_path aponta pra mesma pasta desta página: sem isso,
                    // "upload.html" apareceria na lista como se fosse um upload
                    .filter(function(name) { return name !== 'upload.html'; });

                renderUploaded(names);
            })
            .catch(function() {
                uploadedEl.innerHTML = '<div class="empty">não foi possível carregar a listagem.</div>';
            });
    }

    function deleteUploaded(name, rowEl) {
        var delBtn = rowEl.querySelector('.del-btn');
        if (delBtn) delBtn.disabled = true;

        fetch('/upload/' + encodeURIComponent(name), { method: 'DELETE' })
            .then(function(res) {
                if (res.ok) {
                    rowEl.remove();
                    if (!uploadedEl.children.length)
                        uploadedEl.innerHTML = '<div class="empty">nenhum arquivo em /upload/</div>';
                } else {
                    if (delBtn) delBtn.disabled = false;
                    statusEl.className = 'err';
                    statusEl.textContent = 'Erro ' + res.status + ' ao deletar "' + name + '".';
                }
            })
            .catch(function(err) {
                if (delBtn) delBtn.disabled = false;
                statusEl.className = 'err';
                statusEl.textContent = 'Falha na conexão ao deletar "' + name + '": ' + err.message;
            });
    }

    refreshBtn.addEventListener('click', loadUploaded);

    loadUploaded();
</script>

</body>
</html>
