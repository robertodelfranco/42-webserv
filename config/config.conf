# configuration file for the server

# Server must have the following parameters defined

	# PORT - the port number on which the server will listen

	# ROOT - the root directory from which files will be served


# OPTIONAL PARAMETERS:

	# INDEX - the name of the index file to serve (default: index.html)

	# DOCUMENT_ROOT - the directory from which to serve files (default: /var/www/html)

	# ERROR_PAGES - the directory containing custom error pages (default: /var/www/html/errors)

	# CLIENT_MAX_BODY_SIZE - maximum size of client request body_ in bytes (default: 1048576)

	# LOCATIONS - additional location blocks for specific URL paths (default: none)


# Example configuration:
server {
    listen 8081;# testando trimmm
    root ./root/www;
    client_max_body_size 1M;
    error_page 308 /errors/30x.html;

    location / {
        root ./root/www/html;
        index 'index.html';
        methods GET POST;
        client_max_body_size 50000;
        return 302 https://www.example.com;
    }

    location /cgi-bin {             # testando trimmm
        root ./root/www;
        methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_type .py;
    }

    # location / {}
    #     methods GET;
    #     autoindex off;
    # }

    location /upload {
        methods POST;
        client_max_body_size 100;
    }

    # location /cgi-bin {
    #     root /home/you/www/cgi-bin/;
    #     cgi_path /usr/bin/python3;
    #     cgi_extension .py;
    #     methods GET POST;
    # }
}

server {
  listen 127.0.0.1:8080;
  root ./root/www;
  client_max_body_size 1M;
  error_page 404 /errors/404.html;

  location / {
    methods GET POST;
    index index.html;
    autoindex off;
  }

  location /cgi-bin {
    methods GET POST;
    # cgi por extensão
  }
}
