# configuration file for the server

# Server must have the following parameters defined

	# PORT - the port number on which the server will listen

	# ROOT - the root directory from which files will be served


# OPTIONAL PARAMETERS:

	# INDEX - the name of the index file to serve (default: index.html)

	# DOCUMENT_ROOT - the directory from which to serve files (default: /var/www/html)

	# ERROR_PAGES - the directory containing custom error pages (default: /var/www/html/errors)

	# CLIENT_MAX_BODY_SIZE - maximum size of client request body_ in bytes (default: 1048576)

	# LOCATIONS - additional location blocks for specific URL paths (default: none)


# Example configuration:
server {
    listen 8080;# testando trimmm
    root ./root;
    client_max_body_size 1M;
    error_page 404 405 406 /errors/404.html;

    location / {
        index 'index.html';
        methods GET POST;
        client_max_body_size 50000;
    }

    location /www {
        index index.html;
        return 301 /secrets/;
    }

    location /site_1 {
        root ./root/www/site_1;
        index index.html;
        methods GET;
        client_max_body_size 50000;
    }

    location /secrets {
        autoindex on;
        root ./root/www/secrets;
    }

    location /cgi {
        root ./root/www/cgi-bin;
        methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_type .py;
    }

    # Segundo sistema de CGI, na mesma config, é o bonus 2 do projeto
    # Precisa do php-cgi (o SAPI de CGI), nao do php CLI. sudo apt install php-cgi
    location /cgi-php {
        root ./root/www/cgi-bin;
        methods GET POST;
        cgi_path /usr/bin/php-cgi;
        cgi_type .php;
    }

    location /upload {
        methods GET POST DELETE;
        upload_path ./root/upload;
        autoindex on;
    }
}

server {
  listen 127.0.0.1:8081;
  root ./root/www;
  client_max_body_size 1M;
  error_page 404 /errors/404.html;

  location / {
    methods GET POST;
    index index.html;
    autoindex off;
  }

  location /cgi-bin {
    methods GET POST;
  }
}
