# Config dedicada aos testes de CGI (plano CGI Handler, M0-M6).
# Semantica de path adotada pelo time: nginx-root (disco = root + URI inteira).
#   GET /cgi-bin/hello.py  ->  ./root/www + /cgi-bin/hello.py
#                          ->  ./root/www/cgi-bin/hello.py
# Sem "return 302" aqui: um redirect na location curto-circuitaria o CGI.

server {
    listen 8082;
    root ./root/www;
    client_max_body_size 10M;

    location /cgi {
        root ./root/www/cgi-bin;
        methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_type .py;
    }
}
